  padding: 7px 14px; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }

  const dl = h('dl', {class: 'terms'});
  [['Base policy', 'The released checkpoint at its original precision on the reference GPU (an NVIDIA H100); its closed-loop success is the bar every candidate is held to.'],
   ['Base port', 'The base policy exported to one device: static shapes, FP16 weights with higher precision where needed, and its original steps, horizon and host code; no speed rewrites, fusion or quantization. The baseline for total latency reduction.'],
   ['Lever', 'One optimization option, such as fused denoising, keeping K image tokens, or a W8 pack. Each lever belongs to one stage and is exact or approximate.'],
   ['Stack', 'The cumulative configuration; the compiler stage keeps the fastest exact stack on each device.'],
   ['Engine', 'A stack compiled for one device (TensorRT on NVIDIA, OpenVINO on Intel).'],
   ['Token set', 'The retained tokens and reuse settings. Three carry per policy: the anchor (exact trims only), the fastest point on the latency–score Pareto front over all devices, and the lowest-score front point within about 10 % of that latency.'],
   ['Pack', 'A component-wise assignment of number formats (W8, W4, W8A8, FP8, NVFP4); WxAy means x-bit weights and y-bit activations.'],
   ['Seed floor F', 'The action drift of the base policy itself when only its noise seed changes: the 90th percentile over eight alternative seeds. Measured once per policy; 0.07 to 0.24 across the six.'],
   ['Screen score s', 's = D / F, where D is the 90th-percentile drift of a candidate\'s actions from the FP32 base policy over 420 recorded inputs (the first, middle and last call of 140 episodes), over the executed horizon H. Candidates with s < 0.66 go on to timing.'],
   ['Timing margin τ', 'A candidate advances only if its median latency is at least τ = 2 % below the mean of two runs of the preceding stack, timed just before and just after it.'],
   ['Engine match, b', 'The device engine\'s actions against the same candidate on the reference GPU, in units of F. The tolerance b = D(BF16, FP32) / F is the drift from floating-point rounding alone. Exact levers must pass it; for approximate candidates it is a diagnostic.'],
   ['Δ, se', 'Δ: the paired closed-loop success change against the base policy, in percentage points (pp); episodes are paired by variant, environment seed and sampler noise. se: its standard error from a base-task cluster bootstrap.'],
   ['Pass rule (Δ + ε) / se', 'With the success-loss budget ε = 2 pp, a test passes when (Δ + ε) / se > 2.3, fails when Δ < −ε, and is otherwise inconclusive. It is read after n₁ = 1,000 episodes and, if inconclusive, after n₂ = 5,000 that include the first 1,000.'],
   ['Operating point', 'For each device, the configuration an operator selects from the frontier of measured latency against paired success change, among candidates that have not failed.'],
   ['Device test', 'The operating point\'s engine run on the target device in paired closed loops directly against the base policy, with the same pass rule; only a pass confirms it.'],
   ['Real-time budget', 'Each action chunk must arrive before the previous chunk\'s H executed actions finish: H / 20 s at LIBERO\'s 20 Hz control rate.']]
    .forEach(([k, v]) => { dl.appendChild(h('dt', {}, k)); dl.appendChild(h('dd', {}, v)); });
  c4.appendChild(dl);
  page.appendChild(c4);
}

function tpDevice(box, pol, dev) {
  const head = h('div', {class: 'devhead'});
  head.appendChild(h('h2', {}, `${pol.name} on ${dlong(dev)}`));
  const stat = (v, l) => { const s = h('div', {class: 'stat'}); s.appendChild(h('b', {}, v)); s.appendChild(h('span', {}, l)); head.appendChild(s); };
  stat(fmt(dev.t0) + ' ms', 'Base port, per action chunk');
  if (dev.t1) stat(fmt(dev.t1) + ' ms', 'Compiler stack');
  stat(fmt(dev.best) + ' ms', dev.pick ? 'Operating point' : 'Best so far');
  if (dev.t1 && dev.best) stat(pct(100 * (dev.best - dev.t1) / dev.t1), 'Token + precision');
  stat(dev.t0 && dev.best ? pct(100 * (dev.best - dev.t0) / dev.t0) : '—', 'Total change');
  const H_ = EXEC[pol.id]; if (H_ && dev.best) stat((100 * dev.best / (H_ * 50)).toFixed(1) + ' %', `of the ${H_ * 50} ms budget (H / 20 s)`);
  if (dev.devnote) { const s_ = h('div', {class: 'stat'}); const b_ = h('b'); b_.appendChild(h('span', {class: 'dpill f'}, dev.devnote)); s_.appendChild(b_);
    s_.appendChild(h('span', {}, 'Device test')); head.appendChild(s_); }
  else if (dev.pick) { const s_ = h('div', {class: 'stat'}); const b_ = h('b'); b_.appendChild(dpill(DVERD(dev.pick.devtest))); s_.appendChild(b_);
    s_.appendChild(h('span', {}, 'Device test')); head.appendChild(s_); }
  box.appendChild(head);
  box.appendChild(legend());
  const fig = h('figure', {class: 'figure'}); const scr = h('div', {class: 'scroll'}); scr.appendChild(drawTree(pol, dev)); fig.appendChild(scr);
  fig.appendChild(h('figcaption', {}, 'Read left to right: each box is one timed candidate on this device. Blue outlines carry forward: one compiler stack, then three token sets, ' +
    'each with its precision packs. Hover a box for its latency, screen score s and closed-loop result.'));
  box.appendChild(fig);
  const T = dev.tables || {h100: [], dev: []}, d_ = v => v === '' || v == null ? '—' : v;
  const sec = h('section', {class: 'tables'});
  if (T.h100.length) {
    sec.appendChild(h('h2', {}, 'H100 closed loops'));
    sec.appendChild(h('p', {class: 'note'}, `Every configuration on the way to the ${dev.name} operating point, and every other configuration looped on the H100. ` +
      's: screen score; Success: LIBERO-Plus success rate with its 90 % interval; (Δ+ε)/se: the paired pass statistic against the base policy, passing above 2.3; ' +
      'Engine match: the device engine against the same candidate on the reference GPU, in units of F. Green row: the deployed configuration.'));
    sec.appendChild(table(['Configuration', 's', 'Episodes', 'Success (%)', '(Δ+ε)/se', 'Device latency (ms)', 'Engine match'],
      T.h100.map(r => [r.cfg, d_(r.F), d_(r.n), d_(r.score), d_(r.z), d_(r.ms), d_(r.S)]), ['', 'num', 'num', 'num', 'num', 'num', 'num'],
      T.h100.map(r => r.final ? 'dep' : '')));
  }
  if (T.dev.length) {
    sec.appendChild(h('h2', {}, 'Device closed loops'));
    sec.appendChild(h('p', {class: 'note'}, `Closed loops run on the ${dev.name} engine against the base policy, with the same pass rule. Green row: the deployed configuration.`));
    sec.appendChild(table(['Configuration', 'Success (%)', '(Δ+ε)/se', 'Episodes'], T.dev.map(r => [r.cfg, d_(r.score), d_(r.z), d_(r.n)]),
      ['', 'num', 'num', 'num'], T.dev.map(r => r.final ? 'dep' : '')));
  }
  if (sec.children.length) box.appendChild(sec);
}



function render(hash) {
  hash = hash || '';
  const [pid, did] = hash.split('/');
  const pol = DATA.policies.find(p => p.id === pid);
  document.querySelectorAll('#tabs .tab').forEach(b => b.setAttribute('aria-selected', b.dataset.id === (pol ? pol.id : 'overview') ? 'true' : 'false'));
  const P = document.getElementById('panel'); P.replaceChildren(); hideTip();
  if (!pol) { devTabs(null, null); (TP ? tpOverview : overview)(P); return; }
  const dev = pol.devices.find(d => d.id === did) || pol.devices.find(d => d.id === curDev) || pol.devices[0];
  curPol = pol.id; curDev = dev.id; devTabs(pol, dev);
  const box = h('div', {class: 'devpage'}); P.appendChild(box);
  (TP ? tpDevice : renderDevice)(box, pol, dev);
}

const tabs = document.getElementById('tabs');
[{id: 'overview', name: 'Overview'}].concat(DATA.policies.map(p => ({id: p.id, name: p.name}))).forEach(t => {
  const b = h('button', {class: 'tab', role: 'tab', type: 'button'}); b.dataset.id = t.id;
  b.appendChild(document.createTextNode(t.name));
  b.addEventListener('click', () => nav(t.id === 'overview' ? 'overview' : t.id + (curDev ? '/' + curDev : '')));
  tabs.appendChild(b);
});
let curPol = null, curDev = null;
function devTabs(pol, dev) {
  const D = document.getElementById('devtabs'); D.replaceChildren();
  (pol || DATA.policies[0]).devices.forEach(d => {
    const b = h('button', {class: 'tab', role: 'tab', type: 'button', 'aria-selected': dev && d.id === dev.id ? 'true' : 'false'});
    b.appendChild(document.createTextNode(d.name));
    if (pol) b.appendChild(h('small', {}, d.best ? fmt(d.best) + ' ms' : '—'));
    b.addEventListener('click', () => nav((curPol || DATA.policies[0].id) + '/' + d.id));
    D.appendChild(b);
  });
}
function nav(hash) { try { history.replaceState(null, '', '#' + hash); } catch (e) {} render(hash); scrollTo(0, 0); }
const start = () => { render(decodeURIComponent((location.hash || '').slice(1))); };
addEventListener('hashchange', start);
start();
</script>
